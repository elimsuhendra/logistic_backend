type Account {
  id: String!
  type: AccountType!
  fullName: String
  accountName: String
  initial: String
  userIds: [String]
  logoUrl: String
  logoWidth: Float
  logoHeight: Float
  email: String
  # contactNo: PhoneNumberObject
  # modules: [AccountModule]
  inactive: Boolean
  createdAt: Date
  updatedAt: Date

  # resolver
  avatar: Photo
  users: [User]
  # isSystemAdmin: Boolean
  # settings: [AccountSetting]
}

enum AccountType {
  PERSONAL
  BUSINESS
  SYSTEM
}

# enum AccountModule {
#   SUPPLY_CHAIN
#   EVENT
#   MEMBERSHIP
# }

enum AccountOrder {
  # fullName_DESC
  # fullName_ASC
  accountName_DESC
  accountName_ASC
  initial_DESC
  initial_ASC
  createdAt_DESC
  createdAt_ASC
}

input AccountFilter {
  OR: [AccountFilter!]
  AND: [AccountFilter!]
  _id_in: [String]
  _id_nin: [String]
  type: AccountType
  fullName_regex: String
  accountName: String
  accountName_regex: String
  initial: String
  initial_regex: String
  email: String
  email_regex: String
  search: String
  inactive: Boolean
  inactive_ne: Boolean
  createdAt_gte: Date
  createdAt_lte: Date
}

type AccountResponse {
  success: Boolean!
  message: String
  account: Account
  errors: [Error!]
}

type Query {
  """
  Retrieve a single account by its ID.
  """
  getAccount(id: String): Account
  """
  Retrieve a list of all accounts matching optional filters.
  """
  allAccounts(filter: AccountFilter, first: Int, skip: Int, showAll: Boolean, orderBy: AccountOrder): [Account!]!
  """
  Retrieve count of all accounts matching filters.
  """
  _allAccountsMeta(filter: AccountFilter, showAll: Boolean, first: Int, skip: Int): ObjectMeta
}

input CreateAccountInput {
  accountName: String
  fullName: String
  initial: String
  userId: String
  userIds: [String]
  type: AccountType
  logoUrl: String
  logoWidth: Float
  logoHeight: Float
  email: String
  # contactNo: PhoneNumberObject
  inactive: Boolean
}

input UpdateAccountInput {
  id: String
  accountName: String
  fullName: String
  initial: String
  userId: String
  userIds: [String]
  type: AccountType
  logoUrl: String
  logoWidth: Float
  logoHeight: Float
  email: String
  # contactNo: PhoneNumberObject
  inactive: Boolean
}

type Mutation {
  """
  Create a new account record.
  """
  createAccount(
    userId: String
    input: CreateAccountInput
    accountName: String
    fullName: String
    initial: String
    userIds: [String]
    type: AccountType
    logoUrl: String
    logoWidth: Float
    logoHeight: Float
    email: String
    inactive: Boolean
  ): AccountResponse
  """
  Update an existing account record.
  """
  updateAccount(
    id: String!
    input: UpdateAccountInput
    accountName: String
    fullName: String
    initial: String
    userId: String
    userIds: [String]
    type: AccountType
    logoUrl: String
    logoWidth: Float
    logoHeight: Float
    email: String
    inactive: Boolean
  ): AccountResponse
  """
  Delete an account record.
  @mcp-disabled
  """
  deleteAccount(id: String!): CommonResponse
}

type AccountSubscriptionPayload {
  mutation: _ModelMutationType!
  node: Account
  previousValues: Account
}

type Subscription {
  Account(filter: SubscriptionFilter, dataFilter: AccountFilter): AccountSubscriptionPayload
}