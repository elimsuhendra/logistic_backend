type Approval {
  id: String!
  accountId: String
  reffNo: String
  reffId: String
  collectionName: String
  userId: String
  approval: approvalEnum
  index: Int            # position in the approval order (0 = first approver)
  attempt: Int          # approval round of the record: 1 for its first createApproval, +1 for each later one
  createdAt: Date
  updatedAt: Date
  note: String

  # relations
  user: User
}

enum approvalEnum {
  Approved
  Rejected
  Pending
  Revision   # was Cancelled (db:migrate:approvalRevision)
  Waiting
}

enum ApprovalOrder {
  index_ASC
  index_DESC
  reffNo_DESC
  reffNo_ASC
  createdAt_DESC
  createdAt_ASC
  updatedAt_DESC
  updatedAt_ASC
}

input ApprovalFilter {
  OR: [ApprovalFilter!]
  AND: [ApprovalFilter!]
  _id_in: [String]
  _id_nin: [String]
  reffNo: String
  reffNo_regex: String
  reffId: String
  collectionName: String
  userId: String
  approval: approvalEnum
  index: Int
  attempt: Int
  search: String
  createdAt_gte: Date
  createdAt_lte: Date
}

input ApprovalInput {
  id: String
  accountId: String!
  userId: String!
  collectionName: String
  reffId: String
  reffNo: String
  approval: approvalEnum
  index: Int             # position in the approval order (0 = first approver)
  note: String
}

type CreateApprovalResponse {
  success: Boolean!
  message: String
  approval: Approval
  approvals: [Approval]
}

type UpdateApprovalResponse {
  success: Boolean!
  message: String
  approval: Approval
  approvals: [Approval]
}

type DeleteApprovalResponse {
  success: Boolean!
  message: String
}

type Query {
  allApprovals(
    filter: ApprovalFilter
    first: Int
    skip: Int
    orderBy: ApprovalOrder
  ): [Approval]
  _allApprovalsMeta(filter: ApprovalFilter): ObjectMeta
  getApproval(reffId: String, id: String): Approval
}

type Mutation {
  createApproval(
    input: [ApprovalInput]
  ): CreateApprovalResponse

  # Updates one approval: id is the approval's id (approvalId); the fields sent in
  # input are set on it and updatedAt is set to now
  updateApproval(
    id: String!
    input: ApprovalInput!
  ): UpdateApprovalResponse

  deleteApproval(id: String!): DeleteApprovalResponse
  deleteApprovals(ids: [String!]!): DeleteApprovalResponse
}

type ApprovalSubscriptionPayload {
  mutation: _ModelMutationType!
  node: Approval
  previousValues: Approval
}

type Subscription {
  Approval(filter: SubscriptionFilter, dataFilter: ApprovalFilter): ApprovalSubscriptionPayload
}
