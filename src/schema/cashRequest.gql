type CashRequest {
  id: String!
  jobPlanningId: String
  customerId: String
  consigneeId: String
  userId: String
  accountId: String
  employeeId: String
  requestDate: Date
  cashType: bondTypeEnum
  cashRequestNo: String
  destination: [String]
  destinations: [cashDestinationObject]
  jobs: [cashJobObject]
  otherCash: Float
  sparePartCash: Float
  roundingCash: Float
  requestTotal: Float
  returnTotal: Float
  isDraft: Boolean
  statusOperation: statusOperationKasbonEnum
  # current status of the approval process (from the active approvals): null (no
  # approvals / draft), Pending, Revision, Rejected or Approved (final approver approved)
  approvalStatus: approvalEnum
  # when the approval was last updated: latest updatedAt of the active approvals
  approvalUpdatedAt: Date
  createdAt: Date
  updatedAt: Date
  cashRequestDetails: [cashRequestDetailObject]
  # Penyelesaian (Driver, Lolo, Job, SparePart, Other) live in the
  # CashRequestSettlement collection (cashRequestSettlements)
  cashRequestSettlements: [CashRequestSettlement]
  totalPengajuan: Float
  rounding: Float
  totalAfterRounding: Float
  details: [JSON]

  # relations
  jobPlanning: JobPlanning
  customer: Customer
  consignee: Customer
  user: User
  employee: User
}

# One table row (one No. Job)
type cashRequestDetailObject {
  jobPlanningId: String          # No. Job (picker)
  jobPlanningNo: String          # SA/SO/2610/0002-1
  customerId: String             # Cust
  items: [cashRequestItemObject] # the stacked Qty / Daerah / Nominal lines
  total: Float                   # Total = sum of items[].nominal

  # relations
  jobPlanning: JobPlanning
  customer: Customer
}

# One line inside a row
type cashRequestItemObject {
  qty: Int                       # "2" in "2x35 (cbm)"
  size: Float                    # "35"
  sizeMeasurement: String        # "cbm"
  daerah: String                 # Daerah (required)
  nominal: Float                 # Nominal
}

input cashRequestItemObjectInput {
  qty: Int
  size: Float
  sizeMeasurement: String
  daerah: String!
  nominal: Float
}


input cashRequestDetailObjectInput {
  jobPlanningId: String!
  jobPlanningNo: String
  customerId: String
  items: [cashRequestItemObjectInput]
  total: Float
}

type cashJobObject {
  jobPlanningId: String
  customerId: String
  consigneeId: String
  destinations: [cashDestinationObject]
  total: Float

  # relations
  jobPlanning: JobPlanning
  customer: Customer
  consignee: Customer
}

input cashJobObjectInput {
  jobPlanningId: String
  customerId: String
  consigneeId: String
  destinations: [cashDestinationObjectInput]
  total: Float
}

# Legacy line shape (cash request part only); settlement fields moved to settlementItemObject
type cashDestinationObject {
  jobPlanningId: String
  customerId: String
  consigneeId: String
  destination: String
  nominal: Float
  qty: Int
  size: Float
  sizeMeasurement: String
}

input cashDestinationObjectInput {
  jobPlanningId: String
  customerId: String
  consigneeId: String
  destination: String
  nominal: Float
  qty: Int
  size: Float
  sizeMeasurement: String
}

enum bondTypeEnum {
  PJ
  SP
  KG
}

enum CashRequestOrder {
  cashRequestNo_DESC
  cashRequestNo_ASC
  requestDate_DESC
  requestDate_ASC
  createdAt_DESC
  createdAt_ASC
}

enum statusOperationKasbonEnum {
  Draft
  Pending
  Cancel
  Due_3_Days
  Due_5_Days
  Finish
}

input CashRequestFilter {
  OR: [CashRequestFilter!]
  AND: [CashRequestFilter!]
  _id_in: [String]
  _id_nin: [String]
  cashRequestNo: String
  cashRequestNo_regex: String
  jobPlanningId: String
  customerId: String
  consigneeId: String
  userId: String
  accountId: String
  employeeId: String
  cashType: bondTypeEnum
  isDraft: Boolean
  statusOperation: statusOperationKasbonEnum
  search: String
  requestDate_gte: Date
  requestDate_lte: Date
  createdAt_gte: Date
  createdAt_lte: Date
}

type CreateCashRequestResponse {
  success: Boolean!
  message: String
  cashRequest: CashRequest
}

type UpdateCashRequestResponse {
  success: Boolean!
  message: String
  cashRequest: CashRequest
}

type DeleteCashRequestResponse {
  success: Boolean!
  message: String
}

type UpdateStatusOperationResponse {
  success: Boolean!
  message: String
  # number of cash requests whose statusOperation was changed
  updatedCount: Int
}

type Query {
  allCashRequests(
    filter: CashRequestFilter
    first: Int
    skip: Int
    orderBy: CashRequestOrder
  ): [CashRequest]
  _allCashRequestsMeta(filter: CashRequestFilter): ObjectMeta
  getCashRequest(id: String): CashRequest
  getLastCashRequest(prefixCashRequestNo: String): CashRequest
}

input CashRequestInput {
  userId: String
  accountId: String
  requestDate: Date
  cashType: bondTypeEnum
  cashRequestNo: String

  cashRequestDetails: [cashRequestDetailObjectInput]

  otherCash: Float
  sparePartCash: Float
  roundingCash: Float
  requestTotal: Float
  returnTotal: Float
  isDraft: Boolean
  statusOperation: StatusOperationEnum
  
}

type Mutation {
  createCashRequest(
    input: CashRequestInput!
  ): CreateCashRequestResponse

  updateCashRequest(
    id: String!
    input: CashRequestInput!
  ): UpdateCashRequestResponse

  deleteCashRequest(id: String!): DeleteCashRequestResponse
  deleteCashRequests(ids: [String!]!): DeleteCashRequestResponse

  # Without statusOperation: sets Due_3_Days / Due_5_Days on the given cash requests
  # that are approved (see resolver). With statusOperation (e.g. Finish when the cash
  # request's settlement is approved): sets that status on the given cash requests.
  updateStatusOperation(
    cashRequestIds: [String!]!
    statusOperation: statusOperationKasbonEnum
  ): UpdateStatusOperationResponse
}

type CashRequestSubscriptionPayload {
  mutation: _ModelMutationType!
  node: CashRequest
  previousValues: CashRequest
}

type Subscription {
  CashRequest(filter: SubscriptionFilter, dataFilter: CashRequestFilter): CashRequestSubscriptionPayload
}
