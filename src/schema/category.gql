# Master data grouped by type, e.g. type "voucher-account" = Account select of a voucher.
type Category {
  id: String!
  accountId: String        # empty = shared by every account
  seeder: Boolean
  type: String
  name: String
  label: String
  inactive: Boolean
  createdBy: String        # userId of the creator
  updatedBy: String        # userId of the last updater
  createdAt: Date
  updatedAt: Date
  additionalInfo: [additionalInfoObject]
}

enum CategoryOrder {
  label_ASC
  label_DESC
  name_ASC
  name_DESC
  createdAt_ASC
  createdAt_DESC
}

type additionalInfoObject {
  key: String
  value: JSON              # any JSON value (scalar JSON = graphql-type-json), e.g. isCost: true
}

input CategoryFilter {
  OR: [CategoryFilter!]
  AND: [CategoryFilter!]
  _id_in: [String]
  accountId: String        # also matches rows without accountId (shared)
  type: String
  type_in: [String]
  name: String
  label_regex: String
  isCost: Boolean          # type "cost-revenue" only
  inactive: Boolean        # false also matches rows without the field
}

type Query {
  allCategories(filter: CategoryFilter, first: Int, skip: Int, orderBy: CategoryOrder): [Category]
  _allCategoriesMeta(filter: CategoryFilter): ObjectMeta
  getCategory(id: String!): Category
}
