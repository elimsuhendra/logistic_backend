type Customer {
  id: String!
  name: String
  logo: Photo
  inactive: Boolean
  addresses: String
  contacts: String
  email: String
  createdAt: Date
  updatedAt: Date
  deletedAt: Date

  # resolver
  activityLogs: [ActivityLog]
}

enum CustomerOrder {
  name_DESC
  name_ASC
  createdAt_DESC
  createdAt_ASC
}

input CustomerFilter {
  OR: [CustomerFilter!]
  AND: [CustomerFilter!]
  name: String
  name_in: [String]
  name_contains: String
  name_regex: String
  email: String
  email_regex: String
  addresses_regex: String
  contacts_regex: String
  search: String
  createdAt_gte: Date
  createdAt_lte: Date
  inactive: Boolean
  inactive_ne: Boolean
  _id_nin: [String]
  _id_in: [String]
}

type CustomerResponse {
  success: Boolean!
  message: String
  customer: Customer
  errors: [Error!]
}

type Query {
  allCustomers(filter: CustomerFilter, first: Int, skip: Int, orderBy: CustomerOrder): [Customer]
  _allCustomersMeta(filter: CustomerFilter): ObjectMeta
  getCustomer(id: String): Customer
}

type Mutation {
  createCustomer(
    name: String
    email: String
    addresses: String
    contacts: String
    inactive: Boolean
  ): CustomerResponse
  updateCustomer(
    id: String!
    name: String
    email: String
    addresses: String
    contacts: String
    inactive: Boolean
  ): CustomerResponse
  deleteCustomer(id: String!): CommonResponse
}

type CustomerSubscriptionPayload {
  mutation: _ModelMutationType!
  node: Customer
  previousValues: Customer
}

type Subscription {
  Customer(filter: SubscriptionFilter, dataFilter: CustomerFilter): CustomerSubscriptionPayload
}