type Employee {
  id: String!
  accountId: String
  userId: String
  roleId: String
  employeeID: String
  email: String
  phone: String

  inactive: Boolean
  createdAt: Date
  updatedAt: Date

  groups: [Group]
  lastGroup: Group
  lastGroup2: [Group]
  salary: UserSalary
  account: Account
  roleData: Role
  user: User
}

input EmployeeFilter {
  id_ne: String
  accountId: String
  userId: String
  # false matches employees not marked inactive (field false or missing)
  inactive: Boolean
}

type Query {
  allEmployees(filter: EmployeeFilter, first: Int, skip: Int): [Employee]
}

input EmployeeInput{
  accountId: String
  userId: String
  roleId: String
  employeeID: String
  email: String
  emailEmployee: String
  phone: String
}
