}

type Query {
  allJobApplicants(filter: JobApplicantFilter, first: Int, skip: Int, orderBy: JobApplicantOrder): [JobApplicant]
  _allJobApplicantsMeta(filter: JobApplicantFilter): ObjectMeta
  getJobApplicant(id: String): JobApplicant
  getCalendarInterview(startDate: Date!, endDate: Date!, userIds: [String]): [CalendarInterview]
  getJobOrderSales(date: Date, userIds: [String], phase_in: [String]): JobOrderSales
  getAnalyticsChart(startDate: Date, endDate: Date, userIds: [String]): [AnalyticsChart]
  getAnalyticsByType(startDate: Date, endDate: Date, userIds: [String]): [AnalyticsChartByType]
  getAnalyticsClient(startDate: Date, endDate: Date, userIds: [String]): [AnalyticsClient]
  getSalesSummaryByYear(userIds: [String]): JobApplicantSaleSummary
  getSalesSummaryByTime(startDate: Date, endDate: Date, userIds: [String]): JobApplicantSaleSummary
  getTeamReport(year: Date): [TeamReportResponse]
  getIndividualReport(year: Date): [IndividualReportResponse]
  getActualSales(filter: ActualSalesFilter): [ActualSales!]!
}

type Mutation {
  createJobApplicant(
    jobId: String!
    candidateIds: [String!]!
  ): CreateJobApplicantResponse
  updateJobApplicantDragging(
    jobApplicantsInput: [JobApplicantDraggingInput!]!
  ): UpdateJobApplicantResponse
  updateJobApplicant(
    id: String!
    jobId: String
    candidateId: String
    workflowId: String
    phase: String
    interviewDate: Date
    interviewTime: String
    interviewRemarks: String
    caseClose: String
    invoiceNo: String
    invoiceAmount: Float
    submittedDate: Date
    position: Int
    rejection: JobRejectionInput
    offer: JobOfferInput
    notSelected: JobNotSelectedInput
    unsuccessfulSales: JobUnsuccessfulSalesInput
    contractInvoices: ContractInvoiceInput
    inheritFromConsultant: String
    inheritFromUserId: String
    inheritSalary: Float
    candidate: PeopleInput
  ): UpdateJobApplicantResponse
  updateJobApplicantContractInvoice(
    id: String!, 
    month: Date, 
    invoiceNo: String, 
    invoiceAmount: Float
  ): CommonResponse
  cloneJobApplicant(jobApplicantId: String, jobId: String): DeleteJobApplicantResponse
  deleteJobApplicant(id: String!): DeleteJobApplicantResponse
  exportExcel(
    startDate: Date, endDate: Date, userIds: [String], label: String, status: String
  ): ExportExcelResponse
  exportClientExcel(
    startDate: Date, endDate: Date, userIds: [String], label: String
  ): ExportExcelResponse
  generateAutoFillInvoice: CommonResponse
  createJobApplicantIndexes: CommonResponse
  modifyJobApplicantGroup: CommonResponse
}

type JobApplicantSubscriptionPayload {
  mutation: _ModelMutationType!
  node: JobApplicant
  previousValues: JobApplicant
}

type Subscription {
  JobApplicant(filter: SubscriptionFilter, dataFilter: JobApplicantFilter): JobApplicantSubscriptionPayload
}