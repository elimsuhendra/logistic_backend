type JobApplicant {
  id: String!
  jobId: String
	candidateId: String
	workflowId: String
	phase: String
  position: Int
  rejection: JobRejection
  offer: JobOffer
  notSelected: JobNotSelected
  unsuccessfulSales: JobUnsuccessfulSales
  createdAt: Date
  interviewDate: Date
  interviewTime: String
  interviewRemarks: String
  caseClose: String
  submittedDate: Date
  invoiceNo: String
  invoiceAmount: Float
  contractInvoices: [ContractInvoice]
  inheritFromConsultant: String
  inheritFromUserId: String
  inheritSalary: Float
  inheritMTCMarketing: Boolean
  totalFee: Float

  # resolvers
  jobOrder: JobOrder
  candidate: People
  workflow: Workflow
  documents: [Document]
  notes: [Note]
  activityLogs: [ActivityLog]
  inheritFromUser: User
}

enum JobApplicantOrder {
  createdAt_DESC
  createdAt_ASC
}

type ContractInvoice {
  month: Date
  invoiceNo: String
  invoiceAmount: Float
}

type JobUnsuccessfulSales {
  reason: String
	remarks: String
}

type JobNotSelected {
  remarks: String
}

type JobRejection {
  reason: String
	remarks: String
}

type ContractMonthSalary {
  month: Date
  salary: Float
  fee: Float
}

type JobOffer {
  workType: String
	salary: Float
	consultantId: String
	referred: String
  period: String
  contractPeriod: String
  coBrokeConsultantId: String
  replacementCandidateId: String
  startDate: Date
  endDate: Date
  replacementCandidateStartDate: Date
  isReplacedFallout: Boolean
  isBillDiffMonth: Boolean
  payrollCycleStartDate: Date
  payrollCycleEndDate: Date
  allowanceFee: Float
  adjustmentFee: Float
  oneTimeFee: Float
  contractFee: String
  fee: Float
  isAWS: Boolean
  awsNumber: Float
  guaranteePeriod: Int
  remarks: String
  coBrokeRemarks: String
  placementRate: Float
  customerBillingPercentage: Float
  coBrokeCustomerBillingPercentage: Float
  contractMonthSalaries: [ContractMonthSalary]
  chargeDifference: Boolean
  isClone: Boolean
  replacementType: String
  replacementJobId: String
  replacementReferred: String
  replacementCoBrokeConsultantId: String
  isCoBrokeConsultant: Boolean
  consultantGroupId: String
  coBrokeConsultantGroupId: String

  # resolver
  consultant: User
  coBrokeConsultant: User
  replacementCandidate: People
  replacementJob: JobOrder
  replacementCoBrokeConsultant: User
}

input JobApplicantFilter {
  OR: [JobApplicantFilter!]
  AND: [JobApplicantFilter!]
  phase_regex: String
  phase_contains: String
  phase_nin: [String]
  phase_in: [String]
  jobId: String
  jobId_in: [String]
  candidateId: String
  candidateId_in: [String]
  candidateStatus: String
  mainConsultantIds: [String]
  consultantId: String
  coBrokeConsultantIds: [String]
  startDate_gte: Date
  startDate_lte: Date
  startDate_between: [Date]
  search: String
  caseClose: String
  caseClose_ne: String
  inheritMTCMarketing_ne: Boolean
  offer_workType: String
}

