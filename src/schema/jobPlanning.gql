type JobPlanning {
  id: String!
  jobPlanningNo: String
  customerId: String
  consigneeId: String
  qty: Int
  size: Float
  containerSize: Float
  carType: String
  sizeMeasurement: String
  destination: String
  destinations: [destinationObject]
  reffNo: String
  isDraft: Boolean
  statusOperation: StatusOperationEnum
  createdAt: Date
  updatedAt: Date

  # relations
  customer: Customer
  consignee: Customer

}

type destinationObject {
  destination: String
  qty: Int
  size: Float
  sizeMeasurement: String
  sizeMeasurment: String
  vehicleId: String
  driverId: String
  policeNo: String
  driver: String

  # relations
  vehicle: Vehicle
  driverUser: User
}

input destinationObjectInput {
  destination: String
  qty: Int
  size: Float
  sizeMeasurement: String
  sizeMeasurment: String
  vehicleId: String
  driverId: String
  policeNo: String
  driver: String
}

enum StatusOperationEnum {
  Draft
  Pending
  Cancel
  OnProgress
}

enum JobPlanningOrder {
  jobPlanningNo_DESC
  jobPlanningNo_ASC
  createdAt_DESC
  createdAt_ASC
}

input JobPlanningFilter {
  OR: [JobPlanningFilter!]
  AND: [JobPlanningFilter!]
  _id_in: [String]
  _id_nin: [String]
  jobPlanningNo: String
  jobPlanningNo_regex: String
  customerId: String
  consigneeId: String
  size: String
  containerSize: String
  carType: String
  sizeMeasurement: String
  reffNo: String
  isDraft: Boolean
  search: String
  createdAt_gte: Date
  createdAt_lte: Date
}

type CreateJobPlanningResponse {
  success: Boolean!
  message: String
  jobPlanning: JobPlanning
}

type UpdateJobPlanningResponse {
  success: Boolean!
  message: String
  jobPlanning: JobPlanning
}

type DeleteJobPlanningResponse {
  success: Boolean!
  message: String
}

type Query {
  allJobPlannings(
    filter: JobPlanningFilter
    first: Int
    skip: Int
    orderBy: JobPlanningOrder
  ): [JobPlanning]
  _allJobPlanningsMeta(filter: JobPlanningFilter): ObjectMeta
  getJobPlanning(id: String): JobPlanning
  getLastJobPlanning(prefixJobPlanningNo: String): JobPlanning
}

type Mutation {
  createJobPlanning(
    jobPlanningNo: String
    customerId: String
    consigneeId: String
    qty: Int
    size: String
    containerSize: String
    carType: String
    sizeMeasurement: String
    destination: String
    destinations: [destinationObjectInput]
    reffNo: String
    isDraft: Boolean
  ): CreateJobPlanningResponse

  updateJobPlanning(
    id: String!
    jobPlanningNo: String
    customerId: String
    consigneeId: String
    qty: Int
    size: String
    containerSize: String
    carType: String
    sizeMeasurement: String
    destination: String
    destinations: [destinationObjectInput]
    reffNo: String
    isDraft: Boolean
  ): UpdateJobPlanningResponse

  deleteJobPlanning(id: String!): DeleteJobPlanningResponse
  deleteJobPlannings(ids: [String!]!): DeleteJobPlanningResponse
}

type JobPlanningSubscriptionPayload {
  mutation: _ModelMutationType!
  node: JobPlanning
  previousValues: JobPlanning
}

type Subscription {
  JobPlanning(filter: SubscriptionFilter, dataFilter: JobPlanningFilter): JobPlanningSubscriptionPayload
}