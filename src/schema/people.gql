type CreatePeopleResponse {
  success: Boolean!
  message: String
  people: People
}

type UpdatePeopleResponse {
  success: Boolean!
  message: String
  people: People
}

type DeletePeopleResponse {
  success: Boolean!
  message: String
}

type CheckNameResponse {
  existed: Boolean!
}

type ApplyJobResponse {
  success: Boolean!
  message: String
  people: People
}

type Query {
  allPeople(filter: PeopleFilter, first: Int, skip: Int, orderBy: PeopleOrder): [People]
  _allPeopleMeta(filter: PeopleFilter, first: Int, skip: Int): ObjectMeta
  allFreelancePeople(keyword: String, filter: PeopleFilter, companyFilter: CompanyFilter, first: Int, skip: Int, orderBy: PeopleOrder): [People]
  _allFreelancePeopleMeta(keyword: String, filter: PeopleFilter,companyFilter: CompanyFilter, first: Int, skip: Int): ObjectMeta
  getPeople(id: String): People
  countFreelanceEndContractLteThisMonth: People
}

type Mutation {
  createPeople(
    fullName: String
    nationality: String
    birthday: Date
    gender: String
    race: String
    mobileNumber: String
    mobileCode: String
    mobileNumber2: String
    mobileCode2: String
    source: String
    email: String
    about: String
    industries: [String]
    addresses: [AddressInput]
    idealEmployments: [IdealEmploymentInput]
    lastEmployment: LastEmploymentInput
    isDraft: Boolean
    isPermanent: Boolean
    isTemporary: Boolean
  ): CreatePeopleResponse
  updatePeople(
    id: String!
    fullName: String
    nationality: String
    birthday: Date
    gender: String
    race: String
    mobileNumber: String
    mobileCode: String
    mobileNumber2: String
    mobileCode2: String
    source: String
    email: String
    about: String
    industries: [String]
    addresses: [AddressInput]
    idealEmployments: [IdealEmploymentInput]
    lastEmployment: LastEmploymentInput
    isDraft: Boolean
    availability: Date
    computerSkillIds: [String]
    languageSkillIds: [String]
    expectedMinSalary: Float
    expectedMaxSalary: Float
    jobOrderId: String
    isPermanent: Boolean
    isTemporary: Boolean
  ): UpdatePeopleResponse
  deletePeople(id: String!): DeletePeopleResponse
  deleteBatchPeople(ids: [String!]!): DeletePeopleResponse
  checkCandidateNameExist(fullName: String!, ignoreId: String): CheckNameResponse
  applyJob(jobId: String!, candidate: CandidateInfoInput): ApplyJobResponse
  createCandidateIndexes: CommonResponse
}

type PeopleSubscriptionPayload {
  mutation: _ModelMutationType!
  node: People
  previousValues: People
}

type Subscription {
  People(filter: SubscriptionFilter, dataFilter: PeopleFilter): PeopleSubscriptionPayload
}