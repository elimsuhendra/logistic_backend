type People {
  id: String!
  status: PeopleStatus
  photo: Photo
	fullName: String
	nationality: String
	birthday: Date
	gender: String
	race: String
	mobileNumber: String
	mobileCode: String
  mobileNumber2: String
	mobileCode2: String
  source: String
	email: String
	about: String
  industries: [String]
	addresses: [Address]
  lastEmployment: LastEmployment
  idealEmployments: [IdealEmployment]
  company: Company
  importedFromUrl: String
  importedFromFile: String
  availability: Date
  expectedMinSalary: Float
  expectedMaxSalary: Float
  count: Int
  jobOrderId: String
  # candidateExperiences: [CandidateExperience]
  isPermanent: Boolean
  isTemporary: Boolean


  computerSkillIds: [String]
  languageSkillIds: [String]
  # workExperiences: [Experience]
  # educationExperiences: [Experience]

  # resolvers
  resumes: [Document]
  documents: [Document]
  notes: [Note]
  activityLogs: [ActivityLog]
  jobOrders: [JobOrder]
  applications: [JobApplicant]
  experiences: [Experience]
  skills: [Skill]
  jobOrder: [JobOrder]
}


