input AddressInput {
  country: String
	postal: String
	street: String
	blockNo: String
	position: Int
  primary: Boolean
}

input LastEmploymentInput {
  company: String
  jobTitle: String
  year: String
  month: String
  lastDrawnSalary: Float
}

input IdealEmploymentInput {
  jobTitle: String
  workType: String
  period: String
  minSalary: Float
  maxSalary: Float
}

input CandidateInfoInput {
  fullName: String
  nationality: String
  birthday: Date
  gender: String
  mobileNumber: String
  mobileCode: String
  email: String
  about: String
  addresses: [AddressInput]
}

input PeopleInput {
  id: String!
	source: String
}

