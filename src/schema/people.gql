enum PeopleOrder {
  fullName_DESC
  fullName_ASC
  createdAt_DESC
  createdAt_ASC
}

input PeopleFilter {
  OR: [PeopleFilter!]
  AND: [PeopleFilter!]
  fullName_regex: String
  about_regex: String
  email_regex: String
  gender: String
  gender_regex: String
  race: String
  race_regex: String
  nationality: String
  nationality_regex: String
  industries_in: [String]
  industries_regex: String
  _id_nin: [String]
  _id_in: [String]
  status: PeopleStatus
  status_nin: [String]
  status_in: [String]
  search: String
  salary_lte: Float
  salary_gte: Float
  birthday_lte: Date
  birthday_gte: Date
  birthday_between: [Date]
  companyId: String
  showAttachment: Boolean
  payrollCycleEndDate_gte: Date
  payrollCycleEndDate_lte: Date
}

enum PeopleStatus {
  DRAFT
  ACTIVE
	INTERVIEW
	CLOSED
}

type Address {
  country: String
	postal: String
	street: String
	blockNo: String
	position: Int
  primary: Boolean
}

type LastEmployment {
  company: String
  jobTitle: String
  year: String
  month: String
  lastDrawnSalary: Float
}

type IdealEmployment {
  jobTitle: String
  workType: String
  period: String
  minSalary: Float
  maxSalary: Float
}

