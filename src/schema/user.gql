type User {
  id: String!
  username: String
  fullName: String
  role: RoleType
  roleId: String
  inactive: Boolean
  excludeIndividualReport: Boolean
  createdAt: Date
  updatedAt: Date
  lastLoggedInAt: Date
  dateJoin: Date
  deletedAt: Date
  avatar: Photo
  employeeID: String
  #pilot web
  email: String
  lastName: String
  firstName: String

  mobileNumber: String
  phone: String
  postalCode: String
  country: String
  city: String
  address: String
  state: String
  approved: Boolean
  resetToken: String

  # resolvers
  groups: [Group]
  lastGroup: Group
  lastGroup2: [Group]
  salary: UserSalary
  account: Account
  accounts: [Account]
  roleData: Role
  employees: [Employee]
  employee: Employee
}

enum RoleType {
  SuperAdmin
  Finance
  Admin
  Manager
  TeamLeader
  Staff
  Driver
  AdminPusat
  AdminGarasi
  Pengurus
}

enum UserOrder {
  fullName_DESC
  fullName_ASC
  role_DESC
  role_ASC
  createdAt_DESC
  createdAt_ASC
}

input UserFilter {
  OR: [UserFilter!]
  AND: [UserFilter!]
  fullName_in: [String]
  fullName_contains: String
  fullName_regex: String
  username_regex: String
  name_regex: String
  fullName: String
  role: RoleType
  roleId: String
  role_in: [RoleType]
  role_nin: [RoleType]
  createdAt_gte: Date
  createdAt_lte: Date
  inactive: Boolean
  inactive_ne: Boolean
  _id_nin: [String]
  _id_in: [String]
  approved: Boolean
}

type Query {
  me(accountId: String): User
  allUsers(allowAdmin: Boolean, filter: UserFilter, first: Int, skip: Int, orderBy: UserOrder): [User]
  _allUsersMeta(allowAdmin: Boolean, filter: UserFilter): ObjectMeta
  getUser(id: String): User
  getUserByUsername(username: String!): User
}

type LoginResponse {
  success: Boolean!
  message: String
  token: String
  refreshToken: String
  user: User
  errors: [Error!]
}

type UserIdentityResponse {
  user: User
  success: Boolean!
}

type RegisterResponse {
  success: Boolean!
  message: String
  user: User
  errors: [Error!]
}

type ForgetPasswordResponse {
  success: Boolean!
  message: String
}

type ResetPasswordResponse {
  success: Boolean!
  message: String
}

input UserImportInput {
  row: Int
  fullName: String
  username: String
  email: String
  password: String
  role: String
  employeeID: String
  inactive: Boolean

  mobileNumber: String
  phone: String
}

type UserImportResult {
  row: Int!
  username: String
  email: String
  action: String
  success: Boolean!
  message: String
}

type ImportUsersResponse {
  success: Boolean!
  message: String
  createdCount: Int
  updatedCount: Int
  failedCount: Int
  results: [UserImportResult]
}

input UserInput {
  fullName: String
  username: String
  email: String
  dateJoin: Date
  password: String
  inactive: Boolean
  employee: EmployeeInput
  employees: [EmployeeInput]
}

type Mutation {
  login(username: String, password: String): LoginResponse!
  importUsers(users: [UserImportInput!]!): ImportUsersResponse
  createUser(
    input: UserInput!
  ): RegisterResponse
  updateUser(
    id: String!
    input: UserInput!
  ): RegisterResponse
  updateProfile(
    fullName: String
    currentPassword: String
    email: String
    dateJoin: Date
    inactive: Boolean
    employee: EmployeeInput
    employees: [EmployeeInput]
    newPassword: String
    firstName: String
    lastName: String
    mobileNumber: String
    phone: String
  ): RegisterResponse
  deleteUser(id: String!): CommonResponse
  registerAs(
    username: String!
    email: String!
    password: String!

    mobileNumber: String
  phone: String
    firstName: String
    lastName: String
    address: String
    city: String
    country: String
  ): RegisterResponse 
  forgetPassword(email: String!): ForgetPasswordResponse
  resetPassword(email: String!, token: String!, password: String!): ResetPasswordResponse
}

type UserSubscriptionPayload {
  mutation: _ModelMutationType!
  node: User
  previousValues: User
}

type Subscription {
  User(filter: SubscriptionFilter, dataFilter: UserFilter): UserSubscriptionPayload
}
