# Payment voucher (Voucher Kas Keluar), e.g. PJT/VKK-K/2611/0001.
# One voucher per settlement row; it replaces addCostSettlement / ujlDetails.
type Voucher {
  id: String!
  accountId: String                # tenant (same meaning as on Settlement)
  voucherNo: String                # "Payment / Voucher No." – PJT/VKK-K/{YYMM}/{seq}
  paymentDate: Date                # "Payment Date"
  categoryIdVoucherAccount: String             # "Category Name" with type voucher-acccount
  memo: String                     # "Memo"
  items: [voucherItemObject]       # Cost / Revenue table
  totalCost: Float                 # sum of items where isCost = true
  totalRevenue: Float              # sum of items where isCost = false
  total: Float                     # totalCost - totalRevenue (feeds addCostSettlement)

  # record the voucher belongs to; Detail Add Cost Penyelesaian saves its No. Job:
  reffId: String                   # jobPlanningId
  reffNo: String                   # jobPlanningNo
  reffCollectionName: String       # "jobPlannings"
#   jobPlanningId: String
  lineIndex: Int                   # row of the No. Job (reffId) the voucher belongs to

  isDraft: Boolean
  createdBy: String                # userId of the creator
  updatedBy: String                # userId of the last updater: String                   # created by
  createdAt: Date
  updatedAt: Date

  # relations
  settlement: Settlement
  cashRequest: CashRequest
  jobPlanning: JobPlanning
  user: User
}

# One row of the Cost / Revenue table
type voucherItemObject {
  id: String                       # item id (set by the server when missing)
  categoryIdCostRevenue: String                   # "Cost / Revenue" select
  categoryNameCostRevenue: String                    # label snapshot of the selected cost
  isCost: Boolean                  # true = Cost, false = Revenue
  nominal: Float                   # "Nominal"
  uploadUrl: String                # "Upload"
  inactive: Boolean                # removed tag (kept on the voucher, left out of the totals)
#   isUploaded: Boolean
}

input voucherItemObjectInput {
  id: String                       # send it to keep the item id on update
  categoryIdCostRevenue: String
  categoryNameCostRevenue: String
  isCost: Boolean
  nominal: Float
  uploadUrl: String
#   isUploaded: Boolean
  inactive: Boolean
}

input VoucherInput {
  accountId: String                # tenant; defaults to the logged user's accountId
  createdBy: String                # userId of the creator; defaults to the logged user (ignored on update)
  voucherNo: String                # optional – generated by the server when empty
  paymentDate: Date!
  categoryIdVoucherAccount: String!
  memo: String
  items: [voucherItemObjectInput!]!
  reffId: String                   # reff collection id, e.g. the jobPlanningId
  reffNo: String                   # reff collection no, e.g. the jobPlanningNo (looked up when empty)
  reffCollectionName: String       # reff collection name, e.g. "jobPlannings"
#   jobPlanningId: String
  lineIndex: Int                   # row of the No. Job (reffId) the voucher belongs to
  isDraft: Boolean
}

enum VoucherOrder {
  voucherNo_ASC
  voucherNo_DESC
  paymentDate_ASC
  paymentDate_DESC
  createdAt_ASC
  createdAt_DESC
}

input VoucherFilter {
  OR: [VoucherFilter!]
  AND: [VoucherFilter!]
  _id_in: [String]
  accountId: String
  voucherNo_regex: String
  reffId: String                   # e.g. a jobPlanningId
  reffId_in: [String]              # e.g. the jobPlanningIds of a cash request
  reffCollectionName: String       # e.g. "jobPlannings"
  jobPlanningId: String
  categoryIdVoucherAccount: String
  paymentDate_gte: Date
  paymentDate_lte: Date
}

input UpdateVoucherItemInput {
  id: String!                      # voucherItemObject.id
  inactive: Boolean
}

type VoucherResponse {
  success: Boolean!
  message: String
  voucher: Voucher
}

type Query {
  allVouchers(filter: VoucherFilter, first: Int, skip: Int, orderBy: VoucherOrder): [Voucher]
  _allVouchersMeta(filter: VoucherFilter): ObjectMeta
  # by id (settlement.items[].voucherId)
  getVoucher(id: String!): Voucher
  # [account.initial]/VKK-K/[yy][mm]/[0001..] for the month of paymentDate (default now)
  getNextVoucherNo(accountId: String!, paymentDate: Date): String
}

type Mutation {
  createVoucher(input: VoucherInput!): VoucherResponse
  updateVoucher(id: String!, input: VoucherInput!): VoucherResponse
  # Changes one item of a voucher (input.id = the item id), e.g. { id, inactive: true }
  # when its Add Cost Peny. tag is removed; the totals leave inactive items out
  updateVoucherItem(id: String!, input: UpdateVoucherItemInput!): VoucherResponse
  deleteVoucher(id: String!): VoucherResponse
}