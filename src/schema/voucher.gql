# Payment voucher (Voucher Kas Keluar), e.g. PJT/VKK-K/2611/0001.
# One voucher per settlement row; it replaces addCostSettlement / ujlDetails.
type Voucher {
  id: String!
  accountId: String                # tenant (same meaning as on Settlement)
  voucherNo: String                # "Payment / Voucher No." – PJT/VKK-K/{YYMM}/{seq}
  paymentDate: Date                # "Payment Date"
  cashAccountId: String            # "Account" select (cash / bank account)
  cashAccountName: String          # snapshot of the label shown in the select
  memo: String                     # "Memo"
  items: [voucherItemObject]       # Cost / Revenue table
  totalCost: Float                 # sum of items where isCost = true
  totalRevenue: Float              # sum of items where isCost = false
  total: Float                     # totalCost - totalRevenue (feeds addCostSettlement)

  # link to the settlement row it belongs to
  reffId: String                   # Settlement id
  reffNo: String                   # settlementNo
  reffCollectionName: String       # "settlements"
  cashRequestId: String
  jobPlanningId: String
  lineIndex: Int                   # same key as settlementItemObject.lineIndex

  isDraft: Boolean
  createdBy: String                # userId of the creator
  updatedBy: String                # userId of the last updater: String                   # created by
  createdAt: Date
  updatedAt: Date

  # relations
  settlement: Settlement
  cashRequest: CashRequest
  jobPlanning: JobPlanning
  user: User
}

# One row of the Cost / Revenue table
type voucherItemObject {
  costId: String                   # "Cost / Revenue" select
  biaya: String                    # label snapshot of the selected cost
  isCost: Boolean                  # true = Cost, false = Revenue
  nominal: Float                   # "Nominal"
  uploadUrl: String                # "Upload"
  isUploaded: Boolean
}

input voucherItemObjectInput {
  costId: String
  biaya: String
  isCost: Boolean
  nominal: Float
  uploadUrl: String
  isUploaded: Boolean
}

input VoucherInput {
  accountId: String                # tenant; defaults to the logged user's accountId
  createdBy: String                # userId of the creator; defaults to the logged user (ignored on update)
  voucherNo: String                # optional – generated by the server when empty
  paymentDate: Date!
  cashAccountId: String!
  cashAccountName: String
  memo: String
  items: [voucherItemObjectInput!]!
  reffId: String                   # Settlement id
  cashRequestId: String
  jobPlanningId: String
  lineIndex: Int
  isDraft: Boolean
}

enum VoucherOrder {
  voucherNo_ASC
  voucherNo_DESC
  paymentDate_ASC
  paymentDate_DESC
  createdAt_ASC
  createdAt_DESC
}

input VoucherFilter {
  OR: [VoucherFilter!]
  AND: [VoucherFilter!]
  _id_in: [String]
  accountId: String
  voucherNo_regex: String
  reffId: String
  cashRequestId: String
  jobPlanningId: String
  cashAccountId: String
  paymentDate_gte: Date
  paymentDate_lte: Date
}

type VoucherResponse {
  success: Boolean!
  message: String
  voucher: Voucher
}

type Query {
  allVouchers(filter: VoucherFilter, first: Int, skip: Int, orderBy: VoucherOrder): [Voucher]
  _allVouchersMeta(filter: VoucherFilter): ObjectMeta
  getVoucher(id: String, reffId: String, lineIndex: Int): Voucher
  # [account.initial]/VKK-K/[yy][mm]/[0001..] for the month of paymentDate (default now)
  getNextVoucherNo(accountId: String!, paymentDate: Date): String
}

type Mutation {
  createVoucher(input: VoucherInput!): VoucherResponse
  updateVoucher(id: String!, input: VoucherInput!): VoucherResponse
  deleteVoucher(id: String!): VoucherResponse
}